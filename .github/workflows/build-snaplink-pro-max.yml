name: Build SnapLink PRO MAX APK

on:
  workflow_dispatch:
  push:
    branches: [ snaplink-pro-max ]
    paths:
      - 'snaplink-build/**'
      - '.github/workflows/build-snaplink-pro-max.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Rebuild source archive
        shell: bash
        run: |
          cat snaplink-build/part*.txt > /tmp/snaplink.b64
          base64 --decode /tmp/snaplink.b64 > /tmp/SnapLink-PRO-MAX.zip
          echo 'c45d70fa8fe9fdddc19cf52cca74d909f947c61d1eb30405a54858fa350b8fd1  /tmp/SnapLink-PRO-MAX.zip' | sha256sum -c -
          mkdir -p /tmp/snaplink-src
          unzip -q /tmp/SnapLink-PRO-MAX.zip -d /tmp/snaplink-src
          test -f /tmp/snaplink-src/SnapLinkProMax/settings.gradle.kts

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p /tmp/snaplink-src/SnapLinkProMax :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output
          cp /tmp/snaplink-src/SnapLinkProMax/app/build/outputs/apk/debug/app-debug.apk output/SnapLink-PRO-MAX.apk
          test -s output/SnapLink-PRO-MAX.apk
          sha256sum output/SnapLink-PRO-MAX.apk | tee output/SnapLink-PRO-MAX.sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapLink-PRO-MAX-APK
          path: |
            output/SnapLink-PRO-MAX.apk
            output/SnapLink-PRO-MAX.sha256.txt
          if-no-files-found: error
          retention-days: 30

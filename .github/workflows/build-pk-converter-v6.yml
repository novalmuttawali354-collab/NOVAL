name: Build PK Converter V6 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild base project
        run: |
          cat chunks/00.txt chunks/01.txt chunks/02.txt chunks/03.txt chunks/04.txt chunks/05.txt | base64 -d > project.zip
          unzip -q project.zip

      - name: Patch converter V6
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('PKMobileExpanderV3')

          # 1) CLEAN AT PARSER LEVEL so bad HTML never enters the snippet database.
          p = root / 'app/src/main/java/com/antokon/pkmobile/PerfectKeyboard4pkParser.java'
          s = p.read_text()
          old = '''    private static String cleanupContent(String s) {
                  if (s == null) return "";
                  String x = s.replace("<ent__>", "\\n");
                  // Trim hanya newline/spasi di ujung; isi di tengah tidak diubah.
                  int a = 0, b = x.length();
                  while (a < b && Character.isWhitespace(x.charAt(a))) a++;
                  while (b > a && Character.isWhitespace(x.charAt(b - 1))) b--;
                  return x.substring(a, b);
              }'''.replace('              ', '')
          new = r'''    private static String cleanupContent(String s) {
              if (s == null) return "";
              String x = s.replace("<ent__>", "\n")
                      .replace("\r\n", "\n")
                      .replace('\r', '\n');

              // Perfect Keyboard rich-text macros may be stored as:
              // text#macro:<HTML><HEAD>...<BODY>actual text...</BODY></HTML>
              if (x.regionMatches(true, 0, "text#macro:", 0, "text#macro:".length())) {
                  x = x.substring("text#macro:".length());
              }

              String lower = x.toLowerCase(Locale.ROOT);
              if (lower.contains("<html") || lower.contains("<body") ||
                      lower.contains("<head") || lower.contains("<meta") ||
                      lower.contains("<div") || lower.contains("<p")) {
                  // Remove non-content blocks first.
                  x = x.replaceAll("(?is)<script\\b[^>]*>.*?</script>", "");
                  x = x.replaceAll("(?is)<style\\b[^>]*>.*?</style>", "");
                  x = x.replaceAll("(?is)<head\\b[^>]*>.*?</head>", "");

                  // Keep readable line breaks before stripping tags.
                  x = x.replaceAll("(?i)<br\\s*/?>", "\n");
                  x = x.replaceAll("(?i)</?(p|div|li|tr|h[1-6])\\b[^>]*>", "\n");
                  x = x.replaceAll("(?is)<[^>]+>", "");
                  x = decodeHtmlEntities(x);
              }

              x = x.replace('\u00A0', ' ');
              x = x.replaceAll("[ \\t]+\\n", "\n");
              x = x.replaceAll("\\n[ \\t]+", "\n");
              x = x.replaceAll("\\n{3,}", "\n\n");

              int a = 0, b = x.length();
              while (a < b && Character.isWhitespace(x.charAt(a))) a++;
              while (b > a && Character.isWhitespace(x.charAt(b - 1))) b--;
              return x.substring(a, b);
          }

          private static String decodeHtmlEntities(String value) {
              String x = value.replace("&nbsp;", " ")
                      .replace("&amp;", "&")
                      .replace("&lt;", "<")
                      .replace("&gt;", ">")
                      .replace("&quot;", "\"")
                      .replace("&#39;", "'")
                      .replace("&apos;", "'");
              java.util.regex.Matcher m = java.util.regex.Pattern
                      .compile("&#(x?[0-9A-Fa-f]+);")
                      .matcher(x);
              StringBuffer out = new StringBuffer();
              while (m.find()) {
                  try {
                      String n = m.group(1);
                      int cp = (n.startsWith("x") || n.startsWith("X"))
                              ? Integer.parseInt(n.substring(1), 16)
                              : Integer.parseInt(n, 10);
                      m.appendReplacement(out, java.util.regex.Matcher.quoteReplacement(
                              new String(Character.toChars(cp))));
                  } catch (Exception ex) {
                      m.appendReplacement(out, java.util.regex.Matcher.quoteReplacement(m.group(0)));
                  }
              }
              m.appendTail(out);
              return out.toString();
          }'''
          if old not in s:
              raise SystemExit('cleanupContent original block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Expand requires exportedAt to be an ISO-8601 string, not millis.
          p = root / 'app/src/main/java/com/antokon/pkmobile/MacroRepository.java'
          s = p.read_text()
          s = s.replace(
              'root.put("exportedAt", System.currentTimeMillis());',
              '''java.text.SimpleDateFormat iso = new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", java.util.Locale.US);\n        iso.setTimeZone(java.util.TimeZone.getTimeZone("UTC"));\n        root.put("exportedAt", iso.format(new java.util.Date()));'''
          )
          p.write_text(s)

          # 3) Converter-only: no Accessibility service.
          p = root / 'app/src/main/AndroidManifest.xml'
          s = p.read_text()
          s = re.sub(r'\n\s*<service[\s\S]*?</service>\s*', '\n', s, count=1)
          p.write_text(s)

          # 4) Separate package/version.
          p = root / 'app/build.gradle.kts'
          s = p.read_text()
          s = s.replace('applicationId = "com.antokon.pkmobile"', 'applicationId = "com.antokon.pkconverterv6"')
          s = s.replace('versionCode = 3', 'versionCode = 6')
          s = s.replace('versionName = "3.0"', 'versionName = "6.0"')
          p.write_text(s)

          p = root / 'app/src/main/res/values/strings.xml'
          p.write_text(p.read_text().replace('PK Mobile Expander V3', 'PK Converter V6'))

          # 5) Converter UI only.
          p = root / 'app/src/main/java/com/antokon/pkmobile/MainActivity.java'
          s = p.read_text()
          s = s.replace('PK Mobile Expander V3', 'PK Converter V6')
          s = s.replace(
              'Versi kosong/universal. Pilih file .4pk milik siapa pun, aplikasi membaca shortcut milik file tersebut lalu bisa langsung dipakai atau disimpan menjadi JSON.',
              'Converter .4pk ke JSON Expand. Rich-text/HTML Perfect Keyboard dibersihkan saat file dibaca.'
          )
          s = s.replace('Button accessBtn = button("BUKA PENGATURAN AKSESIBILITAS");',
                        'Button accessBtn = button("BUKA PENGATURAN AKSESIBILITAS");\n        accessBtn.setVisibility(View.GONE);')
          s = s.replace('enabledSwitch.setText("Aktifkan text expander");',
                        'enabledSwitch.setText("Aktifkan text expander");\n        enabledSwitch.setVisibility(View.GONE);')
          s = s.replace('spaceSwitch.setText("Jalankan shortcut saat tekan spasi / Enter");',
                        'spaceSwitch.setText("Jalankan shortcut saat tekan spasi / Enter");\n        spaceSwitch.setVisibility(View.GONE);')
          s = s.replace('        boolean service = isAccessibilityServiceEnabled();\n        statusText.setText(service ? "Layanan: AKTIF ✓" : "Layanan: BELUM AKTIF");\n        statusText.setTextColor(service ? Color.rgb(25, 120, 70) : Color.rgb(180, 55, 55));',
                        '        statusText.setText("Mode: CONVERTER ONLY ✓");\n        statusText.setTextColor(Color.rgb(25, 120, 70));')
          p.write_text(s)
          PY

      - name: Sanity-check fixes
        run: |
          grep -q 'text#macro:' PKMobileExpanderV3/app/src/main/java/com/antokon/pkmobile/PerfectKeyboard4pkParser.java
          grep -q 'decodeHtmlEntities' PKMobileExpanderV3/app/src/main/java/com/antokon/pkmobile/PerfectKeyboard4pkParser.java
          ! grep -q 'root.put("exportedAt", System.currentTimeMillis())' PKMobileExpanderV3/app/src/main/java/com/antokon/pkmobile/MacroRepository.java
          ! grep -q '<service' PKMobileExpanderV3/app/src/main/AndroidManifest.xml

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: PKMobileExpanderV3
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PK-Converter-V6-Fixed-APK
          path: PKMobileExpanderV3/app/build/outputs/apk/debug/app-debug.apk

name: Build PK Converter V8 Clean APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild base project
        run: |
          cat chunks/00.txt chunks/01.txt chunks/02.txt chunks/03.txt chunks/04.txt chunks/05.txt | base64 -d > project.zip
          unzip -q project.zip

      - name: Patch V8 hard cleaner
        run: python scripts/patch_v8.py

      - name: Assert cleaner is wired everywhere
        run: |
          grep -q 'TextCleaner.clean(cleanupContent' PKMobileExpanderV3/app/src/main/java/com/antokon/pkmobile/PerfectKeyboard4pkParser.java
          grep -q 'return TextCleaner.clean(s);' PKMobileExpanderV3/app/src/main/java/com/antokon/pkmobile/PerfectKeyboard4pkParser.java
          grep -q 'String clean = TextCleaner.clean(replacement);' PKMobileExpanderV3/app/src/main/java/com/antokon/pkmobile/PerfectKeyboard4pkParser.java
          test "$(grep -c 'TextCleaner.clean' PKMobileExpanderV3/app/src/main/java/com/antokon/pkmobile/MacroRepository.java)" -ge 5
          grep -q 'JSON dibatalkan karena wrapper HTML Perfect Keyboard masih terdeteksi' PKMobileExpanderV3/app/src/main/java/com/antokon/pkmobile/MacroRepository.java

      - name: Test exact user HTML samples
        run: |
          mkdir -p /tmp/testclasses
          javac -d /tmp/testclasses PKMobileExpanderV3/app/src/main/java/com/antokon/pkmobile/TextCleaner.java scripts/TestCleaner.java
          java -cp /tmp/testclasses TestCleaner

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: PKMobileExpanderV3
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PK-Converter-V8-CLEAN-APK
          path: PKMobileExpanderV3/app/build/outputs/apk/debug/app-debug.apk

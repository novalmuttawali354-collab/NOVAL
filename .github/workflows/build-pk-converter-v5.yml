name: Build PK Converter V5 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild base project
        run: |
          cat chunks/00.txt chunks/01.txt chunks/02.txt chunks/03.txt chunks/04.txt chunks/05.txt | base64 -d > project.zip
          unzip -q project.zip

      - name: Patch converter V5
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('PKMobileExpanderV3')

          # Clean Perfect Keyboard rich-text at JSON export time.
          p = root / 'app/src/main/java/com/antokon/pkmobile/MacroRepository.java'
          s = p.read_text()

          # Expand requires exportedAt to be a quoted ISO-8601 timestamp.
          replacement = '''java.text.SimpleDateFormat iso = new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", java.util.Locale.US);
                  iso.setTimeZone(java.util.TimeZone.getTimeZone("UTC"));
                  root.put("exportedAt", iso.format(new java.util.Date()));'''
          s = s.replace('root.put("exportedAt", System.currentTimeMillis());', replacement)

          old = '            s.put("replacement", e.getValue());'
          new = '''            String rawReplacement = e.getValue();
                  if (isUnsupportedPerfectKeyboardAction(rawReplacement)) continue;
                  String cleanReplacement = cleanPerfectKeyboardRichText(rawReplacement);
                  if (cleanReplacement.isEmpty()) continue;
                  s.put("replacement", cleanReplacement);'''
          if old not in s:
              raise SystemExit('replacement export line not found')
          s = s.replace(old, new, 1)

          helpers = r'''
              private static boolean isUnsupportedPerfectKeyboardAction(String value) {
                  if (value == null) return false;
                  String x = value.toLowerCase(Locale.ROOT);
                  return x.contains("<#>") || x.contains("<wx>") ||
                          x.matches("(?s).*</?(left|right|delete|backspace|home|end|pageup|pagedown)(?:>|\\b).*?");
              }

              private static String cleanPerfectKeyboardRichText(String value) {
                  if (value == null) return "";
                  String x = value.replace("<ent__>", "\n");

                  if (x.regionMatches(true, 0, "text#macro:", 0, "text#macro:".length())) {
                      x = x.substring("text#macro:".length());
                  }

                  String lower = x.toLowerCase(Locale.ROOT);
                  if (lower.contains("<html") || lower.contains("<body") || lower.contains("<div") || lower.contains("<p")) {
                      int body = lower.indexOf("<body");
                      if (body >= 0) {
                          int gt = x.indexOf('>', body);
                          if (gt >= 0) x = x.substring(gt + 1);
                          lower = x.toLowerCase(Locale.ROOT);
                          int end = lower.lastIndexOf("</body>");
                          if (end >= 0) x = x.substring(0, end);
                      }

                      x = x.replaceAll("(?i)<br\\s*/?>", "\n");
                      x = x.replaceAll("(?i)</?(p|div|li|tr|h[1-6])\\b[^>]*>", "\n");
                      x = x.replaceAll("(?s)<[^>]+>", "");
                      x = decodeHtmlEntities(x);
                  }

                  x = x.replace('\u00A0', ' ')
                          .replace("\r\n", "\n")
                          .replace('\r', '\n');
                  x = x.replaceAll("[ \\t]+\n", "\n");
                  x = x.replaceAll("\n[ \\t]+", "\n");
                  x = x.replaceAll("\n{3,}", "\n\n");
                  return x.trim();
              }

              private static String decodeHtmlEntities(String value) {
                  String x = value.replace("&nbsp;", " ")
                          .replace("&amp;", "&")
                          .replace("&lt;", "<")
                          .replace("&gt;", ">")
                          .replace("&quot;", "\"")
                          .replace("&#39;", "'")
                          .replace("&apos;", "'");
                  java.util.regex.Matcher m = java.util.regex.Pattern.compile("&#(x?[0-9A-Fa-f]+);").matcher(x);
                  StringBuffer out = new StringBuffer();
                  while (m.find()) {
                      try {
                          String n = m.group(1);
                          int cp = (n.startsWith("x") || n.startsWith("X"))
                                  ? Integer.parseInt(n.substring(1), 16)
                                  : Integer.parseInt(n, 10);
                          m.appendReplacement(out, java.util.regex.Matcher.quoteReplacement(new String(Character.toChars(cp))));
                      } catch (Exception ex) {
                          m.appendReplacement(out, java.util.regex.Matcher.quoteReplacement(m.group(0)));
                      }
                  }
                  m.appendTail(out);
                  return out.toString();
              }
          '''

          marker = '    public static String readAll(InputStream in) throws IOException {'
          if marker not in s:
              raise SystemExit('readAll marker not found')
          s = s.replace(marker, helpers + '\n' + marker, 1)
          p.write_text(s)

          # Converter-only: remove Accessibility service from the manifest.
          p = root / 'app/src/main/AndroidManifest.xml'
          s = p.read_text()
          s = re.sub(r'\n\s*<service[\s\S]*?</service>\s*', '\n', s, count=1)
          p.write_text(s)

          # Separate app ID/version from V3/V4.
          p = root / 'app/build.gradle.kts'
          s = p.read_text()
          s = s.replace('applicationId = "com.antokon.pkmobile"', 'applicationId = "com.antokon.pkconverterv5"')
          s = s.replace('versionCode = 3', 'versionCode = 5')
          s = s.replace('versionName = "3.0"', 'versionName = "5.0"')
          p.write_text(s)

          p = root / 'app/src/main/res/values/strings.xml'
          p.write_text(p.read_text().replace('PK Mobile Expander V3', 'PK Converter V5'))

          # Hide the old Accessibility/text-expander controls from converter UI.
          p = root / 'app/src/main/java/com/antokon/pkmobile/MainActivity.java'
          s = p.read_text()
          nl = chr(10)
          s = s.replace('PK Mobile Expander V3', 'PK Converter V5')
          s = s.replace(
              'Versi kosong/universal. Pilih file .4pk milik siapa pun, aplikasi membaca shortcut milik file tersebut lalu bisa langsung dipakai atau disimpan menjadi JSON.',
              'Converter .4pk ke JSON Expand. Rich-text Perfect Keyboard otomatis dibersihkan menjadi teks normal.'
          )
          s = s.replace('Button accessBtn = button("BUKA PENGATURAN AKSESIBILITAS");',
                        'Button accessBtn = button("BUKA PENGATURAN AKSESIBILITAS");' + nl + '        accessBtn.setVisibility(View.GONE);')
          s = s.replace('enabledSwitch.setText("Aktifkan text expander");',
                        'enabledSwitch.setText("Aktifkan text expander");' + nl + '        enabledSwitch.setVisibility(View.GONE);')
          s = s.replace('spaceSwitch.setText("Jalankan shortcut saat tekan spasi / Enter");',
                        'spaceSwitch.setText("Jalankan shortcut saat tekan spasi / Enter");' + nl + '        spaceSwitch.setVisibility(View.GONE);')
          s = s.replace('        boolean service = isAccessibilityServiceEnabled();\n        statusText.setText(service ? "Layanan: AKTIF ✓" : "Layanan: BELUM AKTIF");\n        statusText.setTextColor(service ? Color.rgb(25, 120, 70) : Color.rgb(180, 55, 55));',
                        '        statusText.setText("Mode: CONVERTER ONLY ✓");\n        statusText.setTextColor(Color.rgb(25, 120, 70));')
          p.write_text(s)
          PY

      - name: Sanity-check fixes
        run: |
          ! grep -R 'root.put("exportedAt", System.currentTimeMillis())' PKMobileExpanderV3/app/src/main/java/com/antokon/pkmobile/MacroRepository.java
          grep -q 'cleanPerfectKeyboardRichText' PKMobileExpanderV3/app/src/main/java/com/antokon/pkmobile/MacroRepository.java
          grep -q 'text#macro:' PKMobileExpanderV3/app/src/main/java/com/antokon/pkmobile/MacroRepository.java
          ! grep -q '<service' PKMobileExpanderV3/app/src/main/AndroidManifest.xml

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: PKMobileExpanderV3
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PK-Converter-V5-Fixed-APK
          path: PKMobileExpanderV3/app/build/outputs/apk/debug/app-debug.apk
